spring.config.import=optional:file:.env[.properties]

spring.application.name=RideShare

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rideshare}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.cors.allowed-origin=${CORS_ORIGIN_URL:http://localhost:5173}
google.api.key=${GOOGLE_API_KEY}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=TRACE
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-2.amazonaws.com/us-east-2_eOiuBn4ol
aws.s3.bucket=${S3_BUCKET}

# Redis server host and port
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Use this line only if you want to use Spring's built-in @Cacheable abstraction
spring.cache.type=redis
