services:
  mysql:
    image: mysql:latest
    container_name: shop-mysql
    environment:
      MYSQL_DATABASE: rideshare
      MYSQL_USER: ${}
      MYSQL_PASSWORD: shop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
