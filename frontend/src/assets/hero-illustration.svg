  <circle cx="650" cy="145" r="22" fill="#FAF8F4"/>

  <!-- car -->
  <rect x="290" y="330" width="140" height="55" rx="18" fill="#FF6B5B"/>
  <rect x="320" y="300" width="80" height="45" rx="14" fill="#FF6B5B"/>
  <rect x="330" y="308" width="60" height="26" rx="8" fill="#FAF8F4" opacity="0.85"/>
  <circle cx="428" cy="352" r="6" fill="#FAF8F4"/>
  <circle cx="320" cy="386" r="17" fill="#1C1A2E"/>
  <circle cx="320" cy="386" r="6" fill="#FAF8F4"/>
  <circle cx="400" cy="386" r="17" fill="#1C1A2E"/>
  <circle cx="400" cy="386" r="6" fill="#FAF8F4"/>
</svg>
