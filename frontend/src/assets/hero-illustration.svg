<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect x="0" y="0" width="800" height="500" fill="#FAF8F4"/>
  <circle cx="680" cy="110" r="200" fill="#EDEBFA"/>

  <!-- skyline -->
  <rect x="30" y="250" width="70" height="130" rx="10" fill="#DCD9F2"/>
  <rect x="110" y="200" width="60" height="180" rx="10" fill="#C9C5E8"/>
  <rect x="180" y="270" width="85" height="110" rx="10" fill="#DCD9F2"/>

  <!-- road -->
  <rect x="0" y="380" width="800" height="120" fill="#2D2A6E"/>
  <path d="M0,440 H800" fill="none" stroke="#FAF8F4" stroke-width="6" stroke-dasharray="26 20" stroke-linecap="round"/>

  <!-- route line -->
  <path d="M430,352 C500,352 520,230 620,200" fill="none" stroke="#22B8A6" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/>

  <!-- destination pin -->
